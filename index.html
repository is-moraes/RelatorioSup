<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel — Repertório de Louvor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface2: #f8fafc;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --text: #0f172a;
      --text2: #475569;
      --text3: #94a3b8;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --danger: #ef4444;
      --success: #16a34a;
      --orange: #ea580c;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(15,23,42,0.07);
    }

    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }

    /* ---- TOPBAR ---- */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-title { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
    .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---- LAYOUT ---- */
    .main { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px 20px 40px; max-width: 1300px; margin: 0 auto; }
    @media (max-width: 960px) { .main { grid-template-columns: 1fr; } }

    /* ---- CARDS ---- */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .card-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .card-header h2 { font-size: 0.88rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text2); }
    .card-body { padding: 16px; }

    /* ---- MES FORM ---- */
    .mes-form { display: flex; flex-wrap: wrap; gap: 12px; }
    .mes-form .field { flex: 1 1 160px; }

    /* ---- SEMANA ACCORDION ---- */
    .semana-list { display: flex; flex-direction: column; gap: 10px; }

    .semana-block {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .semana-toggle {
      width: 100%; background: var(--surface2); border: none; cursor: pointer;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      text-align: left;
      border-bottom: 1px solid transparent;
      transition: background 0.15s;
    }
    .semana-toggle:hover { background: #f1f5f9; }
    .semana-toggle.open { border-bottom-color: var(--border); background: var(--primary-light); }

    .semana-toggle .chevron {
      width: 20px; height: 20px; border-radius: 50%; background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; transition: transform 0.2s; flex-shrink: 0;
      color: var(--text2);
    }
    .semana-toggle.open .chevron { transform: rotate(90deg); background: var(--primary); color: #fff; }

    .semana-toggle .semana-num { font-weight: 700; font-size: 0.95rem; color: var(--primary); }
    .semana-toggle .semana-meta { font-size: 0.78rem; color: var(--text2); flex: 1; }
    .semana-toggle .semana-badges { display: flex; gap: 6px; flex-wrap: wrap; }

    .semana-body { display: none; padding: 14px 16px; }
    .semana-body.open { display: block; }

    /* ---- SECTION DENTRO DA SEMANA ---- */
    .section-block { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .section-toggle {
      width: 100%; background: var(--surface2); border: none; cursor: pointer;
      padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between;
      text-align: left; border-bottom: 1px solid transparent;
      transition: background 0.15s;
    }
    .section-toggle:hover { background: #f1f5f9; }
    .section-toggle.open { border-bottom-color: var(--border); }
    .section-toggle .section-title { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text2); }
    .section-toggle .section-count { font-size: 0.72rem; padding: 2px 7px; border-radius: 999px; background: var(--border); color: var(--text2); }
    .section-body { display: none; padding: 10px; background: var(--surface); }
    .section-body.open { display: block; }

    /* ---- ITEM ROW ---- */
    .item-row {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: var(--surface2);
    }
    .item-row-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .item-row-header span { font-size: 0.75rem; color: var(--text3); font-weight: 500; }
    .item-fields { display: flex; flex-wrap: wrap; gap: 8px; }
    .item-fields .f { flex: 1 1 130px; }

    /* ---- FORM ---- */
    label { display: block; font-size: 0.72rem; color: var(--text2); margin-bottom: 3px; font-weight: 500; }
    input, select, textarea {
      width: 100%; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border2); font-size: 0.85rem;
      background: var(--surface); color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    textarea { min-height: 52px; resize: vertical; }

    /* ---- BUTTONS ---- */
    button { cursor: pointer; display: inline-flex; align-items: center; gap: 5px; border: none; border-radius: 999px; font-size: 0.8rem; font-weight: 500; padding: 6px 12px; transition: background 0.15s, transform 0.1s, box-shadow 0.15s; }
    button:active { transform: scale(0.97); }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }

    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--border2); }

    .btn-danger { background: #fee2e2; color: var(--danger); }
    .btn-danger:hover { background: #fecaca; }

    .btn-success { background: #dcfce7; color: var(--success); }
    .btn-success:hover { background: #bbf7d0; }

    .btn-orange { background: #fff7ed; color: var(--orange); border: 1px solid #fed7aa; }
    .btn-orange:hover { background: #ffedd5; }

    .btn-icon { width: 28px; height: 28px; padding: 0; justify-content: center; border-radius: 6px; }

    .btn-add-item { margin-top: 6px; font-size: 0.75rem; padding: 5px 10px; }

    /* ---- SEMANA HEADER FIELDS ---- */
    .semana-header-fields { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .semana-header-fields .f { flex: 1 1 200px; }

    /* ---- SCRIPT PANEL ---- */
    .script-panel { position: sticky; top: 68px; }
    .code-box {
      width: 100%; min-height: 200px; max-height: 420px;
      padding: 10px; border-radius: 8px;
      border: 1px solid #374151;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.75rem; line-height: 1.5;
      background: #0f172a; color: #e2e8f0;
      resize: vertical; overflow: auto;
    }
    .copy-success { font-size: 0.78rem; color: var(--success); }

    /* ---- MISC ---- */
    .divider { height: 1px; background: var(--border); margin: 10px 0; }
    .tag { font-size: 0.72rem; padding: 2px 7px; border-radius: 999px; background: var(--primary-light); color: var(--primary); border: 1px solid var(--primary-border); }
    .hint { font-size: 0.75rem; color: var(--text3); margin-top: 4px; }
    .spacer { flex: 1; }

    /* status badge */
    #statusSalvar { font-size: 0.78rem; color: var(--success); font-weight: 500; }

    /* import textarea */
    #importArea { width: 100%; min-height: 80px; font-size: 0.8rem; font-family: ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <span style="font-size:1.2rem;">🎸</span>
      <span class="topbar-title">Painel Repertório</span>
    </div>
    <div class="topbar-actions">
      <button class="btn-secondary" id="btnAdicionarSemana">＋ Semana</button>
      <button class="btn-success" id="btnSalvar">💾 Salvar</button>
      <span id="statusSalvar"></span>
      <button class="btn-primary" id="btnGerarScript">⚙️ Gerar Script</button>
    </div>
  </div>

  <div class="main">

    <!-- COLUNA ESQUERDA -->
    <div>
      <!-- Dados do mês -->
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><h2>📅 Dados do mês</h2></div>
        <div class="card-body">
          <div class="mes-form">
            <div class="field">
              <label>Mês (curto)</label>
              <input id="nomeMesCurto" placeholder="ex: Mar">
            </div>
            <div class="field">
              <label>Ano</label>
              <input id="ano" type="number" placeholder="2026">
            </div>
            <div class="field" style="flex:2 1 280px">
              <label>Nome do Ministério</label>
              <input id="ministerio" placeholder="ex: Min. de Louvor Betel">
            </div>
          </div>
        </div>
      </div>

      <!-- Semanas -->
      <div class="semana-list" id="semanasContainer"></div>

      <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn-secondary" id="btnAdicionarSemana2">＋ Adicionar semana</button>
      </div>
    </div>

    <!-- COLUNA DIREITA (sticky) -->
    <div>
      <!-- Gerar Script -->
      <div class="card script-panel" style="margin-bottom:16px">
        <div class="card-header"><h2>⚙️ Script gerado</h2></div>
        <div class="card-body">
          <p class="hint" style="margin-bottom:10px">
            1. Clique em <strong>Gerar Script</strong> na barra acima.<br>
            2. Copie o código abaixo.<br>
            3. Na página principal, substitua o bloco <code>const mesAtual = { ... }</code> por este.
          </p>
          <textarea id="scriptOutput" class="code-box" readonly></textarea>
          <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
            <button class="btn-primary" id="btnCopiarScript">📋 Copiar</button>
            <span class="copy-success" id="copyStatus"></span>
          </div>
        </div>
      </div>

      <!-- Importar JSON -->
      <div class="card">
        <div class="card-header"><h2>📥 Importar JSON</h2></div>
        <div class="card-body">
          <p class="hint" style="margin-bottom:8px">Cole um objeto <code>mesAtual</code> já existente para editar.</p>
          <textarea id="importArea" placeholder='{ "nomeMesCurto": "Mar", "ano": 2026, ... }'></textarea>
          <button class="btn-orange" id="btnImportar" style="margin-top:8px">📤 Importar e carregar</button>
          <span class="hint" id="importStatus" style="margin-top:6px; display:block;"></span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ─── Estrutura base ───────────────────────────────────────────────────────
    const novaLinha = tipo => ({
      repertorio:    { nome: "", tom: "", Sequência: "" },
      links:         { musica: "", canal: "", url: "", url2: "" },
      vozes:         { funcao: "Voz", nome: "" },
      instrumentos:  { instrumento: "", nome: "" },
      midiaSom:      { area: "", nome: "" }
    }[tipo]);

    let mesAtual = {
      nomeMesCurto: "",
      ano: new Date().getFullYear(),
      ministerio: "",
      semanas: []
    };

    const STORAGE_KEY = "painelRepertorioMesAtual_v2";

    // ─── Persistent state de aberto/fechado ───────────────────────────────────
    let estadoSemanas = {};   // { [semanaIndex]: { open: bool, sections: { repertorio: bool, ... } } }

    function getEstadoSemana(idx) {
      if (!estadoSemanas[idx]) {
        estadoSemanas[idx] = {
          open: false,
          sections: { repertorio: true, links: false, vozes: false, instrumentos: false, midiaSom: false }
        };
      }
      return estadoSemanas[idx];
    }

    // ─── Render ───────────────────────────────────────────────────────────────
    function render() {
      document.getElementById("nomeMesCurto").value = mesAtual.nomeMesCurto || "";
      document.getElementById("ano").value = mesAtual.ano || "";
      document.getElementById("ministerio").value = mesAtual.ministerio || "";

      const container = document.getElementById("semanasContainer");
      container.innerHTML = "";

      mesAtual.semanas.forEach((semana, idx) => {
        container.appendChild(renderSemana(semana, idx));
      });
    }

    function renderSemana(semana, idx) {
      const estado = getEstadoSemana(idx);
      const block = document.createElement("div");
      block.className = "semana-block";
      block.dataset.idx = idx;

      const totalMusicas = semana.repertorio.length;
      const totalLinks   = semana.links.length;
      const totalVozes   = semana.vozes.length;
      const totalInst    = semana.instrumentos.length;

      block.innerHTML = `
        <button class="semana-toggle ${estado.open ? "open" : ""}" data-toggle-semana="${idx}">
          <span class="chevron">▶</span>
          <span class="semana-num">Semana ${semana.numero}</span>
          <span class="semana-meta">${semana.dataLabel ? semana.dataLabel : "Sem data"} ${semana.tema ? "· " + semana.tema : ""}</span>
          <span class="semana-badges">
            <span class="tag">🎵 ${totalMusicas}</span>
            <span class="tag">🎤 ${totalVozes}</span>
            <span class="tag">🎸 ${totalInst}</span>
          </span>
          <button class="btn-danger btn-icon btn-remover-semana" data-remove-semana="${idx}" title="Remover semana" style="margin-left:4px">✕</button>
        </button>

        <div class="semana-body ${estado.open ? "open" : ""}">

          <!-- campos principais -->
          <div class="semana-header-fields">
            <div class="f">
              <label>Data</label>
              <input class="inp-dataLabel" placeholder="ex: 15/03/2026 · 19h" value="${semana.dataLabel || ""}">
            </div>
            <div class="f">
              <label>Tema</label>
              <input class="inp-tema" placeholder="ex: Culto de Ceia" value="${semana.tema || ""}">
            </div>
          </div>

          ${renderSection(semana, idx, "repertorio",   "🎵 Repertório",   ["Nome", "Tom", "Sequência"], estado.sections.repertorio)}
          ${renderSection(semana, idx, "links",         "🔗 Links (YouTube / Cifras)", ["Música", "Canal", "YouTube", "Cifras"], estado.sections.links)}
          ${renderSection(semana, idx, "vozes",         "🎤 Vozes",         ["Função", "Nome"], estado.sections.vozes)}
          ${renderSection(semana, idx, "instrumentos",  "🎸 Instrumentos",  ["Instrumento", "Nome"], estado.sections.instrumentos)}
          ${renderSection(semana, idx, "midiaSom",      "📡 Mídia & Som",   ["Área", "Responsável"], estado.sections.midiaSom)}
        </div>
      `;

      return block;
    }

    function renderSection(semana, semanaIdx, tipo, titulo, _colunas, open) {
      const itens = semana[tipo];
      const count = itens.length;

      const itemsHTML = itens.map((item, iIdx) => {
        return `
          <div class="item-row" data-tipo="${tipo}" data-semana="${semanaIdx}" data-item="${iIdx}">
            <div class="item-row-header">
              <span>${titulo.replace(/.*\s/, "")} #${iIdx + 1}</span>
              <button class="btn-danger btn-icon btn-remover-item" title="Remover">✕</button>
            </div>
            <div class="item-fields">
              ${renderItemFields(tipo, item)}
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="section-block" data-section="${tipo}" data-semana="${semanaIdx}">
          <button class="section-toggle ${open ? "open" : ""}" data-toggle-section="${tipo}" data-semana="${semanaIdx}">
            <span class="section-title">${titulo}</span>
            <span class="section-count">${count}</span>
          </button>
          <div class="section-body ${open ? "open" : ""}">
            ${itemsHTML}
            <button class="btn-secondary btn-add-item" data-add="${tipo}" data-semana="${semanaIdx}">＋ Adicionar</button>
          </div>
        </div>
      `;
    }

    function renderItemFields(tipo, item) {
      if (tipo === "repertorio") return `
        <div class="f"><label>Nome</label><input class="inp-nome" value="${esc(item.nome)}"></div>
        <div class="f" style="max-width:80px"><label>Tom</label><input class="inp-tom" value="${esc(item.tom)}"></div>
        <div class="f" style="max-width:140px"><label>Sequência</label><input class="inp-sequencia" value="${esc(item.Sequência)}"></div>
      `;
      if (tipo === "links") return `
        <div class="f"><label>Música</label><input class="inp-musica" value="${esc(item.musica)}"></div>
        <div class="f" style="max-width:130px"><label>Canal</label><input class="inp-canal" value="${esc(item.canal)}"></div>
        <div class="f"><label>URL YouTube</label><input class="inp-url" value="${esc(item.url)}"></div>
        <div class="f"><label>URL Cifras</label><input class="inp-url2" value="${esc(item.url2)}"></div>
      `;
      if (tipo === "vozes") return `
        <div class="f" style="max-width:130px"><label>Função</label><input class="inp-funcao" value="${esc(item.funcao)}"></div>
        <div class="f"><label>Nome</label><input class="inp-nome" value="${esc(item.nome)}"></div>
      `;
      if (tipo === "instrumentos") return `
        <div class="f" style="max-width:150px"><label>Instrumento</label><input class="inp-instrumento" value="${esc(item.instrumento)}"></div>
        <div class="f"><label>Nome</label><input class="inp-nome" value="${esc(item.nome)}"></div>
      `;
      if (tipo === "midiaSom") return `
        <div class="f"><label>Área</label><input class="inp-area" value="${esc(item.area)}"></div>
        <div class="f"><label>Responsável</label><input class="inp-nome" value="${esc(item.nome)}"></div>
      `;
      return "";
    }

    function esc(v) { return (v || "").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

    // ─── Eventos por delegação ────────────────────────────────────────────────
    document.getElementById("semanasContainer").addEventListener("click", (e) => {

      // Toggle semana
      const toggleSemana = e.target.closest("[data-toggle-semana]");
      if (toggleSemana && !e.target.closest("[data-remove-semana]")) {
        const idx = parseInt(toggleSemana.dataset.toggleSemana, 10);
        getEstadoSemana(idx).open = !getEstadoSemana(idx).open;
        lerFormulario();
        render();
        return;
      }

      // Remover semana
      const removeSemana = e.target.closest("[data-remove-semana]");
      if (removeSemana) {
        e.stopPropagation();
        const idx = parseInt(removeSemana.dataset.removeSemana, 10);
        lerFormulario();
        mesAtual.semanas.splice(idx, 1);
        mesAtual.semanas.forEach((s, i) => s.numero = i + 1);
        estadoSemanas = {};
        render();
        return;
      }

      // Toggle section
      const toggleSection = e.target.closest("[data-toggle-section]");
      if (toggleSection) {
        const tipo = toggleSection.dataset.toggleSection;
        const semanaIdx = parseInt(toggleSection.dataset.semana, 10);
        const estado = getEstadoSemana(semanaIdx);
        estado.sections[tipo] = !estado.sections[tipo];
        lerFormulario();
        render();
        return;
      }

      // Remover item
      const removeItem = e.target.closest(".btn-remover-item");
      if (removeItem) {
        const row = removeItem.closest(".item-row");
        const tipo = row.dataset.tipo;
        const semanaIdx = parseInt(row.dataset.semana, 10);
        const itemIdx = parseInt(row.dataset.item, 10);
        lerFormulario();
        mesAtual.semanas[semanaIdx][tipo].splice(itemIdx, 1);
        render();
        return;
      }

      // Adicionar item
      const addItem = e.target.closest("[data-add]");
      if (addItem) {
        const tipo = addItem.dataset.add;
        const semanaIdx = parseInt(addItem.dataset.semana, 10);
        lerFormulario();
        mesAtual.semanas[semanaIdx][tipo].push(novaLinha(tipo));
        getEstadoSemana(semanaIdx).sections[tipo] = true;
        render();
        return;
      }
    });

    // ─── Botões da topbar ─────────────────────────────────────────────────────
    function adicionarSemana() {
      lerFormulario();
      const numero = mesAtual.semanas.length + 1;
      mesAtual.semanas.push({ numero, dataLabel: "", tema: "", repertorio: [], links: [], vozes: [], instrumentos: [], midiaSom: [] });
      const newIdx = mesAtual.semanas.length - 1;
      getEstadoSemana(newIdx).open = true;
      render();
      setTimeout(() => {
        const blocks = document.querySelectorAll(".semana-block");
        if (blocks.length) blocks[blocks.length - 1].scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
    }

    document.getElementById("btnAdicionarSemana").onclick  = adicionarSemana;
    document.getElementById("btnAdicionarSemana2").onclick = adicionarSemana;

    document.getElementById("btnSalvar").onclick = () => {
      lerFormulario();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(mesAtual));
      const el = document.getElementById("statusSalvar");
      el.textContent = "✓ Salvo";
      setTimeout(() => el.textContent = "", 2000);
    };

    document.getElementById("btnGerarScript").onclick = () => {
      lerFormulario();
      const str = JSON.stringify(mesAtual, null, 2);
      document.getElementById("scriptOutput").value = `const mesAtual = ${str};`;
    };

    document.getElementById("btnCopiarScript").onclick = async () => {
      const txt = document.getElementById("scriptOutput").value;
      if (!txt) return;
      try {
        await navigator.clipboard.writeText(txt);
      } catch (e) {
        const el = document.getElementById("scriptOutput");
        el.select();
        document.execCommand("copy");
      }
      const st = document.getElementById("copyStatus");
      st.textContent = "✓ Copiado!";
      setTimeout(() => st.textContent = "", 2000);
    };

    document.getElementById("btnImportar").onclick = () => {
      const raw = document.getElementById("importArea").value.trim();
      const status = document.getElementById("importStatus");
      try {
        let obj = JSON.parse(raw);
        if (!obj.semanas) throw new Error("Objeto sem campo 'semanas'");
        mesAtual = obj;
        estadoSemanas = {};
        render();
        status.textContent = "✓ Importado com sucesso!";
        status.style.color = "var(--success)";
      } catch (err) {
        status.textContent = "Erro: " + err.message;
        status.style.color = "var(--danger)";
      }
      setTimeout(() => status.textContent = "", 3000);
    };

    // ─── Ler formulário → mesAtual ────────────────────────────────────────────
    function lerFormulario() {
      mesAtual.nomeMesCurto = document.getElementById("nomeMesCurto").value.trim();
      mesAtual.ano = parseInt(document.getElementById("ano").value, 10) || mesAtual.ano;
      mesAtual.ministerio = document.getElementById("ministerio").value.trim();

      document.querySelectorAll(".semana-block").forEach(block => {
        const idx = parseInt(block.dataset.idx, 10);
        const semana = mesAtual.semanas[idx];
        if (!semana) return;

        semana.dataLabel = block.querySelector(".inp-dataLabel")?.value.trim() || "";
        semana.tema      = block.querySelector(".inp-tema")?.value.trim() || "";

        // Lê cada item-row
        const tiposLer = ["repertorio", "links", "vozes", "instrumentos", "midiaSom"];
        tiposLer.forEach(tipo => {
          const rows = block.querySelectorAll(`.item-row[data-tipo="${tipo}"]`);
          semana[tipo] = Array.from(rows).map(row => lerItem(tipo, row));
        });
      });
    }

    function lerItem(tipo, row) {
      const v = sel => row.querySelector(sel)?.value.trim() || "";
      if (tipo === "repertorio")   return { nome: v(".inp-nome"), tom: v(".inp-tom"), "Sequência": v(".inp-sequencia") };
      if (tipo === "links")        return { musica: v(".inp-musica"), canal: v(".inp-canal"), url: v(".inp-url"), url2: v(".inp-url2") };
      if (tipo === "vozes")        return { funcao: v(".inp-funcao"), nome: v(".inp-nome") };
      if (tipo === "instrumentos") return { instrumento: v(".inp-instrumento"), nome: v(".inp-nome") };
      if (tipo === "midiaSom")     return { area: v(".inp-area"), nome: v(".inp-nome") };
      return {};
    }

    // ─── Init ─────────────────────────────────────────────────────────────────
    function init() {
      const salvo = localStorage.getItem(STORAGE_KEY);
      if (salvo) {
        try { mesAtual = JSON.parse(salvo); } catch (e) { console.error(e); }
      }
      render();
    }

    init();
  </script>
</body>
</html>
